    <meta charset="utf-8">

    <meta name="description" content="Personal site coming soon.">
    <link rel="canonical" href="/resume/">
    <meta http-equiv="refresh" content="0; url=/resume/">

  <body>
    <main>
      <h1>Redirecting…</h1>
      <p>If you are not redirected automatically, <a href="/resume/">click here</a>.</p>
      <script>
        (function () {
          var target = '/resume/';
          if (location.pathname !== '/' && location.pathname !== '/index.html') return;
          try {
            window.location.replace(target);
          } catch (e) {
            window.location.href = target;
          }
        })();
      </script>
      <noscript>
        <meta http-equiv="refresh" content="0; url=/resume/">
      </noscript>
    </main>
  </body>
</html>
